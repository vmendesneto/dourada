name: Aplicar botão de manilhas no rodapé

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Mover botão de manilhas para o rodapé
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/ui/game_page.dart')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Trecho esperado uma vez, encontrado {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '''            if (!spectator)\n              Positioned(\n                right: phone ? 6 : 18,\n                bottom: phone ? 2 : 8,\n                child: _ManilhasButton(game: game),\n              ),\n''',
              '',
          )

          replace_once(
              '''                padding: EdgeInsets.symmetric(horizontal: compact ? 4 : 5),\n''',
              '''                padding: EdgeInsets.symmetric(horizontal: compact ? 2 : 5),\n''',
          )

          replace_once(
              '''          children: [\n            cards(compact: true),\n            const SizedBox(width: 6),\n            challengeButton(width: 116, height: 42),\n          ],\n''',
              '''          children: [\n            _ManilhasButton(game: game, compact: true),\n            const SizedBox(width: 4),\n            cards(compact: true),\n            const SizedBox(width: 4),\n            challengeButton(width: 108, height: 42),\n          ],\n''',
          )

          replace_once(
              '''      child: Row(\n        children: [\n          cards(compact: false),\n          const SizedBox(width: 16),\n          challengeButton(width: 150, height: 52),\n        ],\n      ),\n''',
              '''      child: Row(\n        children: [\n          _ManilhasButton(game: game),\n          const SizedBox(width: 10),\n          cards(compact: false),\n          const SizedBox(width: 16),\n          challengeButton(width: 150, height: 52),\n        ],\n      ),\n''',
          )

          replace_once(
              '''class _ManilhasButton extends StatelessWidget {\n  const _ManilhasButton({required this.game});\n\n  final DouradinhaGame game;\n''',
              '''class _ManilhasButton extends StatelessWidget {\n  const _ManilhasButton({required this.game, this.compact = false});\n\n  final DouradinhaGame game;\n  final bool compact;\n''',
          )

          replace_once(
              '''    return IconButton.filledTonal(\n      tooltip: 'Consultar manilhas',\n''',
              '''    return IconButton.filledTonal(\n      tooltip: 'Consultar manilhas',\n      style: IconButton.styleFrom(\n        fixedSize: Size.square(compact ? 38 : 48),\n        padding: EdgeInsets.zero,\n        tapTargetSize: MaterialTapTargetSize.shrinkWrap,\n      ),\n''',
          )

          replace_once(
              '''      icon: const Icon(Icons.auto_awesome, size: 18),\n''',
              '''      icon: Icon(Icons.auto_awesome, size: compact ? 16 : 18),\n''',
          )

          path.write_text(text)
          PY

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Formatar ajuste
        run: dart format lib/ui/game_page.dart

      - name: Instalar dependências
        run: flutter pub get

      - name: Analisar projeto
        run: flutter analyze

      - name: Executar testes
        run: flutter test

      - name: Salvar alteração validada
        shell: bash
        run: |
          git restore analysis_options.yaml pubspec.lock 2>/dev/null || true
          rm .github/workflows/apply-manilhas-footer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ui/game_page.dart .github/workflows/apply-manilhas-footer.yml
          git commit -m "move botão de manilhas para o rodapé"
          git push origin HEAD:main

      - name: Publicar versão atualizada
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
