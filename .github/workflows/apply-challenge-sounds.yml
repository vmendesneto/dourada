name: Aplicar sons dos desafios

on:
  push:
    branches:
      - feat/sons-desafios
    paths:
      - .github/workflows/apply-challenge-sounds.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6
        with:
          ref: feat/sons-desafios

      - name: Aplicar sons
        run: python .github/scripts/apply_challenge_sounds.py

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Atualizar dependências e validar
        run: |
          flutter pub get
          dart format lib/ui/game_page.dart
          flutter analyze
          flutter test

      - name: Salvar alteração validada
        run: |
          rm .github/workflows/apply-challenge-sounds.yml
          rm .github/scripts/apply_challenge_sounds.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ui/game_page.dart pubspec.yaml pubspec.lock .github/workflows/apply-challenge-sounds.yml .github/scripts/apply_challenge_sounds.py
          git commit -m "toca sons nos desafios e respostas"
          git push origin HEAD:feat/sons-desafios
