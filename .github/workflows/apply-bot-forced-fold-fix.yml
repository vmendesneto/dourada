name: Aplicar correção de derrota matemática dos robôs

on:
  push:
    branches:
      - fix/bot-fold-disputa-perdida
    paths:
      - .github/workflows/apply-bot-forced-fold-fix.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6
        with:
          ref: fix/bot-fold-disputa-perdida

      - name: Aplicar correção e testes de regressão
        run: python .github/scripts/apply_bot_forced_fold_fix.py

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validar Flutter
        run: |
          flutter pub get
          dart format lib/game/douradinha_game.dart test/douradinha_game_test.dart
          flutter test test/douradinha_game_test.dart

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Validar Worker
        working-directory: cloudflare
        run: |
          npm ci
          npm run check

      - name: Salvar correção validada na branch
        run: |
          rm .github/workflows/apply-bot-forced-fold-fix.yml
          rm .github/scripts/apply_bot_forced_fold_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "faz robos correrem de disputa ja perdida"
          git push origin HEAD:fix/bot-fold-disputa-perdida
