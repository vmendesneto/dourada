name: Aplicar correção de derrota matemática dos robôs

on:
  push:
    branches:
      - fix/bot-fold-disputa-perdida
    paths:
      - .github/workflows/apply-bot-forced-fold-fix.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6
        with:
          ref: fix/bot-fold-disputa-perdida

      - name: Aplicar correção e testes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: esperado 1 trecho, encontrado {count}")
              file.write_text(text.replace(old, new, 1))

          dart_old = '''  bool _currentTrickIsLockedAgainst(int team) {
            final visibleTrick = currentTrick.where((play) => !play.hidden).toList();
            if (visibleTrick.isEmpty) return false;
            final topStrength =
                visibleTrick.map((play) => play.card.strength).reduce(max);
            final publicCodes = <String>{
              ...playedCards
                  .where((play) => !play.hidden)
                  .map((play) => play.card.code),
              ...visibleTrick.map((play) => play.card.code),
            };
            final aStrongerCardCanStillAppear = PlayingCard.fullDeck().any(
              (card) => !publicCodes.contains(card.code) && card.strength > topStrength,
            );
            if (aStrongerCardCanStillAppear) return false;

            final topTeams = visibleTrick
                .where((play) => play.card.strength == topStrength)
                .map((play) => players[play.playerIndex].team)
                .toSet();
            final provisionalWinner = topTeams.length == 1 ? topTeams.single : null;
            final disputeWinner = resolveDisputeWinner([
              ...trickWinners,
              provisionalWinner,
            ]);
            return disputeWinner != null && disputeWinner != team;
          }
          '''

          dart_new = '''  bool _currentTrickIsLockedAgainst(int team) {
            final visibleTrick = currentTrick.where((play) => !play.hidden).toList();
            if (visibleTrick.isEmpty) return false;

            final playersWhoAlreadyPlayed =
                currentTrick.map((play) => play.playerIndex).toSet();
            final remainingTeamCards = <({int playerIndex, PlayingCard card})>[
              for (final player in players)
                if (player.team == team &&
                    !playersWhoAlreadyPlayed.contains(player.id))
                  for (final card in player.hand)
                    (playerIndex: player.id, card: card),
            ];

            bool disputeIsLostWith(List<PlayedCard> trick) {
              final provisionalWinner = resolveTrickWinner(trick, players)?.team;
              final disputeWinner = resolveDisputeWinner([
                ...trickWinners,
                provisionalWinner,
              ]);
              return disputeWinner != null && disputeWinner != team;
            }

            if (remainingTeamCards.isEmpty) {
              return disputeIsLostWith(currentTrick);
            }

            // Só é derrota matemática quando nenhuma carta que o trio ainda
            // pode realmente jogar evita que a disputa seja encerrada contra ele.
            for (final candidate in remainingTeamCards) {
              final simulatedTrick = [
                ...currentTrick,
                PlayedCard(
                  playerIndex: candidate.playerIndex,
                  card: candidate.card,
                ),
              ];
              if (!disputeIsLostWith(simulatedTrick)) return false;
            }
            return true;
          }
          '''
          replace_once('lib/game/douradinha_game.dart', dart_old, dart_new)

          dart_resolve_old = '''    final botTeam = 1 - humanTeam;
            _botChallengeConsideredThisTrick[botTeam] = true;
            final foldingLosesMatch =
          '''
          dart_resolve_new = '''    final botTeam = 1 - humanTeam;
            _botChallengeConsideredThisTrick[botTeam] = true;

            if (_currentTrickIsLockedAgainst(botTeam)) {
              const message = 'O trio adversário conversou e correu do desafio.';
              challengeNotice = message;
              challengeNoticeAccepted = false;
              _finishHand(
                challenge.challengerTeam,
                points: handValue,
                reason: message,
              );
              return;
            }

            final foldingLosesMatch =
          '''
          replace_once('lib/game/douradinha_game.dart', dart_resolve_old, dart_resolve_new)

          dart_test_marker = '''    test('trio de robôs conversa e corre quando todos estão fracos', () {
          '''
          dart_tests = '''    test('trio de robôs corre quando a disputa já está matematicamente perdida', () {
            final game = DouradinhaGame(random: Random(43));
            game.currentPlayerIndex = game.humanPlayerIndex;
            game.trickLeaderIndex = 2;
            game.trickWinners.add(0);
            const leadingPlay = PlayedCard(
              playerIndex: 2,
              card: PlayingCard('J', 'p'),
            );
            game.currentTrick.add(leadingPlay);
            game.playedCards.add(leadingPlay);

            final botCards = <int, List<PlayingCard>>{
              1: const [PlayingCard('2', 'p')],
              3: const [PlayingCard('A', 'p')],
              5: const [PlayingCard('5', 'p')],
            };
            for (final entry in botCards.entries) {
              game.players[entry.key].hand
                ..clear()
                ..addAll(entry.value);
            }

            game.requestHumanChallenge();
            game.resolveBotChallenge();

            expect(game.phase, MatchPhase.handFinished);
            expect(game.lastHandWinner, 0);
            expect(game.pendingChallenge, isNull);
            expect(game.challengeNoticeAccepted, isFalse);
            expect(game.challengeNotice, contains('correu'));
          });

          test('trio não é forçado a correr se ainda consegue superar a mesa', () {
            final game = DouradinhaGame(random: Random(47));
            game.currentPlayerIndex = game.humanPlayerIndex;
            game.trickLeaderIndex = 2;
            game.trickWinners.add(0);
            const leadingPlay = PlayedCard(
              playerIndex: 2,
              card: PlayingCard('J', 'p'),
            );
            game.currentTrick.add(leadingPlay);
            game.playedCards.add(leadingPlay);

            final botCards = <int, List<PlayingCard>>{
              1: const [PlayingCard('2', 'p')],
              3: const [PlayingCard('Q', 'o')],
              5: const [PlayingCard('A', 'p')],
            };
            for (final entry in botCards.entries) {
              game.players[entry.key].hand
                ..clear()
                ..addAll(entry.value);
            }

            game.requestHumanChallenge();
            game.resolveBotChallenge();

            expect(game.phase, MatchPhase.playing);
            expect(game.lastHandWinner, isNull);
            expect(game.scores, [0, 0]);
          });

          ''' + dart_test_marker
          replace_once('test/douradinha_game_test.dart', dart_test_marker, dart_tests)

          ts_pending_old = '''  if (game.pendingChallenge !== null) {
            acceptPendingChallenge(game);
            return { state: game, nextDelayMs: 650 };
          }
          '''
          ts_pending_new = '''  if (game.pendingChallenge !== null) {
            if (
              currentTrickIsLockedAgainst(
                game,
                game.pendingChallenge.targetTeam,
              )
            ) {
              foldPendingChallenge(game);
            } else {
              acceptPendingChallenge(game);
            }
            return { state: game, nextDelayMs: 650 };
          }
          '''
          replace_once('cloudflare/src/game.ts', ts_pending_old, ts_pending_new)

          ts_marker = '''function chooseBotCard(game: GameState, playerIndex: number): string | null {
          '''
          ts_helper = '''export function currentTrickIsLockedAgainst(
            game: GameState,
            team: number,
          ): boolean {
            const visibleTrick = game.currentTrick.filter((play) => !play.hidden);
            if (visibleTrick.length === 0) return false;

            const playersWhoAlreadyPlayed = new Set(
              game.currentTrick.map((play) => play.playerIndex),
            );
            const remainingTeamCards = game.playerHands.flatMap((hand, playerIndex) =>
              playerIndex % 2 === team && !playersWhoAlreadyPlayed.has(playerIndex)
                ? hand.map((card) => ({ playerIndex, card }))
                : [],
            );

            const disputeIsLostWith = (trick: PlayedCardState[]): boolean => {
              const provisionalWinner = resolveTrickWinner(trick);
              const provisionalTeam =
                provisionalWinner === null ? null : provisionalWinner % 2;
              const disputeWinner = resolveDisputeWinner([
                ...game.trickWinners,
                provisionalTeam,
              ]);
              return disputeWinner !== null && disputeWinner !== team;
            };

            if (remainingTeamCards.length === 0) {
              return disputeIsLostWith(game.currentTrick);
            }

            return remainingTeamCards.every(({ playerIndex, card }) =>
              disputeIsLostWith([
                ...game.currentTrick,
                { playerIndex, card },
              ]),
            );
          }

          ''' + ts_marker
          replace_once('cloudflare/src/game.ts', ts_marker, ts_helper)

          ts_test_marker = '''  it("aplica no servidor aceitar, correr e aumentar", () => {
          '''
          ts_tests = '''  it("robô substituto corre quando a disputa já está matematicamente perdida", () => {
            const game = fixture();
            game.trickWinners = [0];
            game.currentTrick = [{ playerIndex: 2, card: "Jp" }];
            game.playedCards = [...game.currentTrick];
            game.playerHands = [
              ["4o"],
              ["2p"],
              [],
              ["Ap"],
              ["5o"],
              ["5p"],
            ];
            game.pendingChallenge = {
              challengerTeam: 0,
              challengerPlayer: 0,
              targetTeam: 1,
              requestedValue: 2,
              responderPlayer: 1,
            };

            const step = advanceBot(game);

            expect(step.state.phase).toBe("handFinished");
            expect(step.state.lastHandWinner).toBe(0);
            expect(step.state.pendingChallenge).toBeNull();
            expect(step.state.challengeNoticeAccepted).toBe(false);
            expect(step.state.challengeNotice).toContain("correram");
          });

          it("robô substituto pode aceitar quando o trio ainda consegue superar a mesa", () => {
            const game = fixture();
            game.trickWinners = [0];
            game.currentTrick = [{ playerIndex: 2, card: "Jp" }];
            game.playedCards = [...game.currentTrick];
            game.playerHands = [
              ["4o"],
              ["2p"],
              [],
              ["Qo"],
              ["5o"],
              ["Ap"],
            ];
            game.pendingChallenge = {
              challengerTeam: 0,
              challengerPlayer: 0,
              targetTeam: 1,
              requestedValue: 2,
              responderPlayer: 1,
            };

            const step = advanceBot(game);

            expect(step.state.phase).toBe("playing");
            expect(step.state.handValue).toBe(2);
            expect(step.state.pendingChallenge).toBeNull();
            expect(step.state.challengeNoticeAccepted).toBe(true);
          });

          ''' + ts_test_marker
          replace_once('cloudflare/test/game.test.ts', ts_test_marker, ts_tests)

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Testar Flutter
        run: |
          flutter pub get
          flutter test test/douradinha_game_test.dart

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Testar Worker
        working-directory: cloudflare
        run: |
          npm ci
          npm run check

      - name: Salvar correção na branch
        run: |
          rm .github/workflows/apply-bot-forced-fold-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/game/douradinha_game.dart test/douradinha_game_test.dart cloudflare/src/game.ts cloudflare/test/game.test.ts .github/workflows/apply-bot-forced-fold-fix.yml
          git commit -m "faz robos correrem de disputa ja perdida"
          git push origin HEAD:fix/bot-fold-disputa-perdida
