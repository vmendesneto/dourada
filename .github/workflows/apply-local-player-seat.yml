name: Aplicar jogador local na mesa

on:
  push:
    branches:
      - feat/jogador-local-na-mesa
    paths:
      - .github/workflows/apply-local-player-seat.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6
        with:
          ref: feat/jogador-local-na-mesa

      - name: Aplicar ajuste visual
        run: python .github/scripts/apply_local_player_seat.py

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validar Flutter
        run: |
          flutter pub get
          dart format lib/ui/game_page.dart
          flutter analyze
          flutter test

      - name: Salvar alteração validada
        run: |
          rm .github/workflows/apply-local-player-seat.yml
          rm .github/scripts/apply_local_player_seat.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ui/game_page.dart .github/workflows/apply-local-player-seat.yml .github/scripts/apply_local_player_seat.py
          git commit -m "move jogador local para a mesa"
          git push origin HEAD:feat/jogador-local-na-mesa
