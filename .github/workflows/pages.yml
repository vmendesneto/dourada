name: Publicar Flutter Web no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar o Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Analisar o projeto
        run: flutter analyze

      - name: Executar os testes
        run: flutter test

      - name: Preparar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Compilar o jogo para Web
        run: >-
          flutter build web --release --base-href /
          --pwa-strategy=none
          --dart-define=DOURADA_SERVER_URL=${{ vars.DOURADA_SERVER_URL }}

      - name: Evitar versões antigas no cache do navegador
        run: |
          sed -i "s|flutter_bootstrap.js|flutter_bootstrap.js?v=${GITHUB_SHA}|" build/web/index.html
          sed -i "s|main.dart.js|main.dart.js?v=${GITHUB_SHA}|" build/web/flutter_bootstrap.js

      - name: Enviar os arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
