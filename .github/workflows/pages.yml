name: Publicar Flutter Web no GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 50

      - name: Aplicar jogador local na mesa
        run: python .github/scripts/apply_local_player_seat.py

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Analisar o projeto
        run: flutter analyze

      - name: Executar os testes
        run: flutter test

      - name: Salvar ajuste validado
        run: |
          git checkout 916228fe16b85e9078963f175b0a4406f03e38e6 -- .github/workflows/pages.yml
          rm .github/workflows/apply-local-player-seat.yml
          rm .github/scripts/apply_local_player_seat.py
          rm .github/trigger-layout-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ui/game_page.dart .github/workflows/pages.yml .github/workflows/apply-local-player-seat.yml .github/scripts/apply_local_player_seat.py .github/trigger-layout-validation.txt
          git commit -m "move jogador local para a mesa"
          git push origin HEAD:main

      - name: Preparar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Compilar o jogo para Web
        run: >-
          flutter build web --release --base-href /dourada/
          --pwa-strategy=none
          --dart-define=DOURADA_SERVER_URL=${{ vars.DOURADA_SERVER_URL }}

      - name: Evitar versões antigas no cache do navegador
        run: |
          sed -i "s|flutter_bootstrap.js|flutter_bootstrap.js?v=${GITHUB_SHA}|" build/web/index.html
          sed -i "s|main.dart.js|main.dart.js?v=${GITHUB_SHA}|" build/web/flutter_bootstrap.js

      - name: Enviar os arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
