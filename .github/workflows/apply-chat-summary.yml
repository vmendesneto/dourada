name: Aplicar resumo compacto do chat

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/chat-summary-trigger.txt'

permissions:
  contents: write
  actions: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ajustar chat
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          game_path = Path('lib/ui/game_page.dart')
          text = game_path.read_text()

          send_pattern = re.compile(
              r"(keyName: 'tecla-chat-enviar',\s+onPressed: widget\.canSend && text\.trim\(\)\.isNotEmpty\s+\? \(\) \{\s+widget\.onSend\(\);\s+)setState\(\(\) \{\}\);",
              re.S,
          )
          text, count = send_pattern.subn(r'\1widget.onClose();', text, count=1)
          if count != 1:
              raise SystemExit(f'Botão enviar do teclado virtual substituído {count} vezes')

          new_strip = r'''class _TableChatStrip extends StatelessWidget {
            const _TableChatStrip({required this.session});

            final TableSession session;

            Future<void> _openChat(BuildContext context) async {
              await showDialog<void>(
                context: context,
                builder: (context) => _ChatDialog(session: session),
              );
            }

            @override
            Widget build(BuildContext context) {
              final phone = _usesVirtualChatKeyboard(context);
              const visibleCount = 2;
              final messages = session.chatMessages;
              final start = messages.length > visibleCount
                  ? messages.length - visibleCount
                  : 0;
              final recent = messages.sublist(start);

              return Container(
                key: const ValueKey('chat-mesa-resumo'),
                height: phone ? 48 : 56,
                padding: EdgeInsets.fromLTRB(phone ? 6 : 14, 5, phone ? 6 : 14, 5),
                decoration: const BoxDecoration(
                  color: Color(0xFF063327),
                  border: Border(top: BorderSide(color: Colors.white12)),
                ),
                child: Row(
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
                    Expanded(
                      child: Container(
                        padding: EdgeInsets.symmetric(
                          horizontal: phone ? 8 : 10,
                          vertical: 4,
                        ),
                        decoration: BoxDecoration(
                          color: Colors.black.withValues(alpha: .16),
                          borderRadius: BorderRadius.circular(7),
                          border: Border.all(color: Colors.white12),
                        ),
                        child: recent.isEmpty
                            ? Align(
                                alignment: Alignment.centerLeft,
                                child: Text(
                                  'Nenhuma mensagem ainda',
                                  style: TextStyle(
                                    color: Colors.white38,
                                    fontSize: phone ? 10 : 11,
                                  ),
                                ),
                              )
                            : Column(
                                mainAxisAlignment: MainAxisAlignment.center,
                                crossAxisAlignment: CrossAxisAlignment.stretch,
                                children: [
                                  for (final message in recent)
                                    Text(
                                      '${message.author}: ${message.text}',
                                      maxLines: 1,
                                      overflow: TextOverflow.ellipsis,
                                      style: TextStyle(
                                        color: Colors.white70,
                                        fontSize: phone ? 10 : 11,
                                        height: 1.05,
                                      ),
                                    ),
                                ],
                              ),
                      ),
                    ),
                    const SizedBox(width: 5),
                    IconButton.filledTonal(
                      key: const ValueKey('abrir-chat'),
                      tooltip: 'Abrir chat',
                      onPressed: () => _openChat(context),
                      style: IconButton.styleFrom(
                        fixedSize: Size.square(phone ? 34 : 42),
                        padding: EdgeInsets.zero,
                        tapTargetSize: MaterialTapTargetSize.shrinkWrap,
                      ),
                      icon: Icon(Icons.forum_rounded, size: phone ? 17 : 20),
                    ),
                  ],
                ),
              );
            }
          }

          class _ChatDialog extends StatefulWidget {'''

          strip_pattern = re.compile(
              r'class _TableChatStrip extends StatefulWidget \{.*?class _ChatDialog extends StatefulWidget \{',
              re.S,
          )
          text, count = strip_pattern.subn(new_strip, text, count=1)
          if count != 1:
              raise SystemExit(f'Bloco _TableChatStrip substituído {count} vezes')
          game_path.write_text(text)

          test_path = Path('test/widget_test.dart')
          tests = test_path.read_text()
          new_test = r'''  testWidgets(
            'chat mostra duas mensagens e envia apenas pelo diálogo no telefone',
            (tester) async {
              tester.view.physicalSize = const Size(360, 640);
              tester.view.devicePixelRatio = 1;
              addTearDown(tester.view.resetPhysicalSize);
              addTearDown(tester.view.resetDevicePixelRatio);
              SharedPreferences.setMockInitialValues({});

              await tester.pumpWidget(
                DouradinhaApp(authService: FakeAuthService(signedIn: true)),
              );
              await tester.pump();
              await tester.tap(find.byKey(const ValueKey('entrar-em-uma-mesa')));
              await tester.pumpAndSettle();

              expect(find.byKey(const ValueKey('input-chat-rapido')), findsNothing);
              expect(find.byKey(const ValueKey('enviar-chat-rapido')), findsNothing);

              final dynamic pageState = tester.state(find.byType(GamePage));
              final dynamic session = pageState.tableSession;
              session.sendChatMessage('primeira');
              session.sendChatMessage('segunda');
              session.sendChatMessage('terceira');
              await tester.pump();

              expect(find.text('Jogador: primeira'), findsNothing);
              expect(find.text('Jogador: segunda'), findsOneWidget);
              expect(find.text('Jogador: terceira'), findsOneWidget);

              await tester.tap(find.byKey(const ValueKey('abrir-chat')));
              await tester.pumpAndSettle();
              expect(find.byKey(const ValueKey('dialogo-chat')), findsOneWidget);

              final input = find.byKey(const ValueKey('input-chat-dialogo'));
              expect(input, findsOneWidget);
              expect(tester.widget<TextField>(input).readOnly, isTrue);

              await tester.tap(input);
              await tester.pumpAndSettle();
              expect(
                find.byKey(const ValueKey('teclado-virtual-chat')),
                findsOneWidget,
              );

              await tester.tap(find.byKey(const ValueKey('tecla-chat-a')));
              await tester.pump();
              expect(tester.widget<TextField>(input).controller!.text, 'a');

              await tester.tap(find.byKey(const ValueKey('tecla-chat-enviar')));
              await tester.pumpAndSettle();
              expect(find.byKey(const ValueKey('teclado-virtual-chat')), findsNothing);
              expect(find.byKey(const ValueKey('dialogo-chat')), findsOneWidget);
              expect(tester.widget<TextField>(input).controller!.text, isEmpty);
              expect(find.text('a'), findsOneWidget);
              expect(tester.takeException(), isNull);

              await tester.pumpWidget(const SizedBox.shrink());
            },
          );

          testWidgets('anima a foto do humano quando chega a vez dele', (tester) async {'''

          test_pattern = re.compile(
              r"  testWidgets\(\s*'chat no telefone usa teclado virtual sem abrir teclado do sistema',.*?  testWidgets\('anima a foto do humano quando chega a vez dele', \(tester\) async \{",
              re.S,
          )
          tests, count = test_pattern.subn(new_test, tests, count=1)
          if count != 1:
              raise SystemExit(f'Teste antigo do chat substituído {count} vezes')
          test_path.write_text(tests)
          PY

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Formatar
        run: dart format lib/ui/game_page.dart test/widget_test.dart

      - name: Dependências
        run: flutter pub get

      - name: Analisar
        run: flutter analyze

      - name: Testar
        run: flutter test

      - name: Salvar implementação validada
        shell: bash
        run: |
          rm -f .github/workflows/apply-chat-summary.yml
          git checkout -- analysis_options.yaml pubspec.lock 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/ui/game_page.dart test/widget_test.dart .github/workflows/apply-chat-summary.yml
          git commit -m 'simplifica resumo do chat'
          git push origin HEAD:main

      - name: Publicar Flutter Web
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
