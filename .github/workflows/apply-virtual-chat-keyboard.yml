name: Aplicar teclado virtual do chat

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Implementar teclado virtual
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          game_path = Path('lib/ui/game_page.dart')
          text = game_path.read_text()
          start = text.index('class _TableChatStrip extends StatefulWidget')
          end = text.index('class _ManilhasButton extends StatelessWidget', start)
          replacement = r'''bool _usesVirtualChatKeyboard(BuildContext context) {
            return MediaQuery.sizeOf(context).shortestSide < 600;
          }

          Future<void> _showVirtualChatKeyboard({
            required BuildContext context,
            required TextEditingController controller,
            required VoidCallback onSend,
            required bool canSend,
          }) {
            return showGeneralDialog<void>(
              context: context,
              barrierDismissible: true,
              barrierLabel: 'Fechar teclado virtual',
              barrierColor: Colors.transparent,
              transitionDuration: const Duration(milliseconds: 180),
              pageBuilder: (dialogContext, animation, secondaryAnimation) {
                return Align(
                  alignment: Alignment.bottomCenter,
                  child: Material(
                    color: Colors.transparent,
                    child: SafeArea(
                      top: false,
                      child: _VirtualChatKeyboard(
                        controller: controller,
                        canSend: canSend,
                        onSend: onSend,
                        onClose: () => Navigator.of(dialogContext).pop(),
                      ),
                    ),
                  ),
                );
              },
              transitionBuilder: (context, animation, secondaryAnimation, child) {
                final position = Tween<Offset>(
                  begin: const Offset(0, 1),
                  end: Offset.zero,
                ).animate(
                  CurvedAnimation(parent: animation, curve: Curves.easeOutCubic),
                );
                return SlideTransition(position: position, child: child);
              },
            );
          }

          class _VirtualChatKeyboard extends StatefulWidget {
            const _VirtualChatKeyboard({
              required this.controller,
              required this.canSend,
              required this.onSend,
              required this.onClose,
            });

            final TextEditingController controller;
            final bool canSend;
            final VoidCallback onSend;
            final VoidCallback onClose;

            @override
            State<_VirtualChatKeyboard> createState() => _VirtualChatKeyboardState();
          }

          class _VirtualChatKeyboardState extends State<_VirtualChatKeyboard> {
            static const _rows = <List<String>>[
              ['q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p'],
              ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l', 'ç'],
              ['z', 'x', 'c', 'v', 'b', 'n', 'm'],
              ['á', 'é', 'í', 'ó', 'ú', 'ã', 'õ', 'ç', '?', '!'],
            ];

            bool _shift = false;

            int _safeOffset(int value, int length) => math.max(0, math.min(value, length));

            void _insert(String rawValue) {
              if (!widget.canSend) return;
              final value = _shift ? rawValue.toUpperCase() : rawValue;
              final current = widget.controller.value;
              final text = current.text;
              final selection = current.selection;
              final rawStart = selection.isValid ? selection.start : text.length;
              final rawEnd = selection.isValid ? selection.end : text.length;
              final start = _safeOffset(math.min(rawStart, rawEnd), text.length);
              final end = _safeOffset(math.max(rawStart, rawEnd), text.length);
              final next = text.replaceRange(start, end, value);
              if (next.length > TableChatMessage.maxTextLength) return;
              widget.controller.value = TextEditingValue(
                text: next,
                selection: TextSelection.collapsed(offset: start + value.length),
              );
              setState(() {
                if (_shift && RegExp(r'[A-Za-zÀ-ÿ]').hasMatch(value)) {
                  _shift = false;
                }
              });
            }

            void _backspace() {
              if (!widget.canSend) return;
              final current = widget.controller.value;
              final text = current.text;
              if (text.isEmpty) return;
              final selection = current.selection;
              var start = selection.isValid ? selection.start : text.length;
              var end = selection.isValid ? selection.end : text.length;
              start = _safeOffset(start, text.length);
              end = _safeOffset(end, text.length);
              if (start > end) {
                final swap = start;
                start = end;
                end = swap;
              }
              if (start == end) {
                if (start == 0) return;
                start -= 1;
              }
              final next = text.replaceRange(start, end, '');
              widget.controller.value = TextEditingValue(
                text: next,
                selection: TextSelection.collapsed(offset: start),
              );
              setState(() {});
            }

            Widget _button({
              required Widget child,
              required VoidCallback? onPressed,
              required String keyName,
              int flex = 1,
              Color? backgroundColor,
              Color? foregroundColor,
            }) {
              return Expanded(
                flex: flex,
                child: Padding(
                  padding: const EdgeInsets.symmetric(horizontal: 2, vertical: 2),
                  child: SizedBox(
                    height: 32,
                    child: FilledButton.tonal(
                      key: ValueKey(keyName),
                      onPressed: onPressed,
                      style: FilledButton.styleFrom(
                        padding: EdgeInsets.zero,
                        minimumSize: Size.zero,
                        tapTargetSize: MaterialTapTargetSize.shrinkWrap,
                        visualDensity: VisualDensity.compact,
                        backgroundColor: backgroundColor,
                        foregroundColor: foregroundColor,
                      ),
                      child: FittedBox(fit: BoxFit.scaleDown, child: child),
                    ),
                  ),
                ),
              );
            }

            Widget _letterRow(List<String> keys) {
              return Row(
                children: [
                  for (final key in keys)
                    _button(
                      keyName: 'tecla-chat-$key',
                      onPressed: widget.canSend ? () => _insert(key) : null,
                      child: Text(
                        _shift ? key.toUpperCase() : key,
                        style: const TextStyle(fontWeight: FontWeight.w800),
                      ),
                    ),
                ],
              );
            }

            @override
            Widget build(BuildContext context) {
              final text = widget.controller.text;
              return Container(
                key: const ValueKey('teclado-virtual-chat'),
                width: double.infinity,
                constraints: const BoxConstraints(maxWidth: 900),
                padding: const EdgeInsets.fromLTRB(6, 6, 6, 7),
                decoration: const BoxDecoration(
                  color: Color(0xFF092E25),
                  border: Border(top: BorderSide(color: Colors.white24)),
                  boxShadow: [
                    BoxShadow(
                      color: Colors.black54,
                      blurRadius: 14,
                      offset: Offset(0, -4),
                    ),
                  ],
                ),
                child: Column(
                  mainAxisSize: MainAxisSize.min,
                  children: [
                    Row(
                      children: [
                        Expanded(
                          child: Container(
                            height: 32,
                            alignment: Alignment.centerLeft,
                            padding: const EdgeInsets.symmetric(horizontal: 9),
                            decoration: BoxDecoration(
                              color: Colors.black26,
                              borderRadius: BorderRadius.circular(7),
                              border: Border.all(color: Colors.white12),
                            ),
                            child: Text(
                              text.isEmpty ? 'Digite uma mensagem...' : text,
                              maxLines: 1,
                              overflow: TextOverflow.ellipsis,
                              style: TextStyle(
                                color: text.isEmpty ? Colors.white38 : Colors.white,
                                fontSize: 12,
                              ),
                            ),
                          ),
                        ),
                        const SizedBox(width: 6),
                        Text(
                          '${text.length}/${TableChatMessage.maxTextLength}',
                          style: const TextStyle(color: Colors.white38, fontSize: 9),
                        ),
                        IconButton(
                          key: const ValueKey('fechar-teclado-chat'),
                          tooltip: 'Fechar teclado',
                          onPressed: widget.onClose,
                          visualDensity: VisualDensity.compact,
                          icon: const Icon(Icons.keyboard_hide_rounded, size: 20),
                        ),
                      ],
                    ),
                    const SizedBox(height: 2),
                    for (final row in _rows) _letterRow(row),
                    Row(
                      children: [
                        _button(
                          keyName: 'tecla-chat-shift',
                          onPressed: widget.canSend
                              ? () => setState(() => _shift = !_shift)
                              : null,
                          backgroundColor: _shift ? const Color(0xFFB9822D) : null,
                          foregroundColor: _shift ? Colors.white : null,
                          child: const Icon(Icons.arrow_upward_rounded, size: 17),
                        ),
                        _button(
                          keyName: 'tecla-chat-virgula',
                          onPressed: widget.canSend ? () => _insert(',') : null,
                          child: const Text(','),
                        ),
                        _button(
                          keyName: 'tecla-chat-espaco',
                          flex: 4,
                          onPressed: widget.canSend ? () => _insert(' ') : null,
                          child: const Text('ESPAÇO', style: TextStyle(fontSize: 10)),
                        ),
                        _button(
                          keyName: 'tecla-chat-ponto',
                          onPressed: widget.canSend ? () => _insert('.') : null,
                          child: const Text('.'),
                        ),
                        _button(
                          keyName: 'tecla-chat-apagar',
                          onPressed: widget.canSend ? _backspace : null,
                          child: const Icon(Icons.backspace_outlined, size: 17),
                        ),
                        _button(
                          keyName: 'tecla-chat-enviar',
                          onPressed: widget.canSend && text.trim().isNotEmpty
                              ? () {
                                  widget.onSend();
                                  setState(() {});
                                }
                              : null,
                          backgroundColor: const Color(0xFF1D6A50),
                          foregroundColor: Colors.white,
                          child: const Icon(Icons.send_rounded, size: 17),
                        ),
                      ],
                    ),
                  ],
                ),
              );
            }
          }

          class _TableChatStrip extends StatefulWidget {
            const _TableChatStrip({required this.session});

            final TableSession session;

            @override
            State<_TableChatStrip> createState() => _TableChatStripState();
          }

          class _TableChatStripState extends State<_TableChatStrip> {
            final TextEditingController _controller = TextEditingController();
            final FocusNode _focusNode = FocusNode();

            @override
            void dispose() {
              _controller.dispose();
              _focusNode.dispose();
              super.dispose();
            }

            void _send() {
              if (!widget.session.sendChatMessage(_controller.text)) return;
              _controller.clear();
              if (!_usesVirtualChatKeyboard(context)) _focusNode.requestFocus();
            }

            Future<void> _openVirtualKeyboard(bool canSend) async {
              _focusNode.unfocus();
              await _showVirtualChatKeyboard(
                context: context,
                controller: _controller,
                canSend: canSend,
                onSend: _send,
              );
            }

            Future<void> _openChat() async {
              _focusNode.unfocus();
              await showDialog<void>(
                context: context,
                builder: (context) => _ChatDialog(session: widget.session),
              );
            }

            @override
            Widget build(BuildContext context) {
              final phone = _usesVirtualChatKeyboard(context);
              final visibleCount = phone ? 1 : 5;
              final messages = widget.session.chatMessages;
              final start = messages.length > visibleCount
                  ? messages.length - visibleCount
                  : 0;
              final recent = messages.sublist(start);
              final canSend = !widget.session.enabled || widget.session.canPlayHere;

              return Container(
                key: const ValueKey('chat-mesa-resumo'),
                height: phone ? 70 : 116,
                padding: EdgeInsets.fromLTRB(phone ? 6 : 14, 4, phone ? 6 : 14, 5),
                decoration: const BoxDecoration(
                  color: Color(0xFF063327),
                  border: Border(top: BorderSide(color: Colors.white12)),
                ),
                child: Column(
                  children: [
                    SizedBox(
                      height: phone ? 27 : 65,
                      child: Row(
                        crossAxisAlignment: CrossAxisAlignment.stretch,
                        children: [
                          Expanded(
                            child: Container(
                              padding: EdgeInsets.symmetric(
                                horizontal: phone ? 8 : 10,
                                vertical: phone ? 5 : 4,
                              ),
                              decoration: BoxDecoration(
                                color: Colors.black.withValues(alpha: .16),
                                borderRadius: BorderRadius.circular(7),
                                border: Border.all(color: Colors.white12),
                              ),
                              child: recent.isEmpty
                                  ? Align(
                                      alignment: Alignment.centerLeft,
                                      child: Text(
                                        'Nenhuma mensagem ainda',
                                        style: TextStyle(
                                          color: Colors.white38,
                                          fontSize: phone ? 10 : 11,
                                        ),
                                      ),
                                    )
                                  : Column(
                                      mainAxisAlignment: MainAxisAlignment.end,
                                      crossAxisAlignment: CrossAxisAlignment.stretch,
                                      children: [
                                        for (final message in recent)
                                          Text(
                                            '${message.author}: ${message.text}',
                                            maxLines: 1,
                                            overflow: TextOverflow.ellipsis,
                                            style: TextStyle(
                                              color: Colors.white70,
                                              fontSize: phone ? 10 : 11,
                                              height: 1.05,
                                            ),
                                          ),
                                      ],
                                    ),
                            ),
                          ),
                          const SizedBox(width: 5),
                          IconButton.filledTonal(
                            key: const ValueKey('abrir-chat'),
                            tooltip: 'Abrir chat',
                            onPressed: _openChat,
                            style: IconButton.styleFrom(
                              fixedSize: Size.square(phone ? 34 : 42),
                              padding: EdgeInsets.zero,
                              tapTargetSize: MaterialTapTargetSize.shrinkWrap,
                            ),
                            icon: Icon(Icons.forum_rounded, size: phone ? 17 : 20),
                          ),
                        ],
                      ),
                    ),
                    const SizedBox(height: 4),
                    Expanded(
                      child: Row(
                        children: [
                          Expanded(
                            child: TextField(
                              key: const ValueKey('input-chat-rapido'),
                              controller: _controller,
                              focusNode: _focusNode,
                              enabled: canSend,
                              readOnly: phone,
                              maxLength: TableChatMessage.maxTextLength,
                              textInputAction: TextInputAction.send,
                              onTap: phone && canSend
                                  ? () => _openVirtualKeyboard(canSend)
                                  : null,
                              onSubmitted: phone ? null : (_) => _send(),
                              style: TextStyle(
                                color: Colors.white,
                                fontSize: phone ? 11 : 13,
                              ),
                              decoration: InputDecoration(
                                hintText: canSend
                                    ? 'Digite uma mensagem...'
                                    : 'Reconectando ao chat...',
                                hintStyle: const TextStyle(color: Colors.white38),
                                counterText: '',
                                isDense: true,
                                filled: true,
                                fillColor: Colors.black12,
                                contentPadding: EdgeInsets.symmetric(
                                  horizontal: phone ? 8 : 10,
                                  vertical: phone ? 7 : 9,
                                ),
                                border: OutlineInputBorder(
                                  borderRadius: BorderRadius.circular(7),
                                  borderSide: BorderSide.none,
                                ),
                              ),
                            ),
                          ),
                          const SizedBox(width: 5),
                          IconButton.filled(
                            key: const ValueKey('enviar-chat-rapido'),
                            tooltip: 'Enviar mensagem',
                            onPressed: canSend ? _send : null,
                            style: IconButton.styleFrom(
                              fixedSize: Size.square(phone ? 34 : 42),
                              padding: EdgeInsets.zero,
                              tapTargetSize: MaterialTapTargetSize.shrinkWrap,
                            ),
                            icon: Icon(Icons.send_rounded, size: phone ? 17 : 20),
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class _ChatDialog extends StatefulWidget {
            const _ChatDialog({required this.session});

            final TableSession session;

            @override
            State<_ChatDialog> createState() => _ChatDialogState();
          }

          class _ChatDialogState extends State<_ChatDialog> {
            final TextEditingController _controller = TextEditingController();
            final ScrollController _scrollController = ScrollController();
            final FocusNode _focusNode = FocusNode();

            @override
            void initState() {
              super.initState();
              widget.session.addListener(_onSessionChanged);
              _scrollToBottom(jump: true);
            }

            @override
            void dispose() {
              widget.session.removeListener(_onSessionChanged);
              _controller.dispose();
              _scrollController.dispose();
              _focusNode.dispose();
              super.dispose();
            }

            void _onSessionChanged() {
              if (!mounted) return;
              setState(() {});
              _scrollToBottom();
            }

            void _scrollToBottom({bool jump = false}) {
              WidgetsBinding.instance.addPostFrameCallback((_) {
                if (!mounted || !_scrollController.hasClients) return;
                final target = _scrollController.position.maxScrollExtent;
                if (jump) {
                  _scrollController.jumpTo(target);
                } else {
                  _scrollController.animateTo(
                    target,
                    duration: const Duration(milliseconds: 180),
                    curve: Curves.easeOut,
                  );
                }
              });
            }

            void _send() {
              if (!widget.session.sendChatMessage(_controller.text)) return;
              _controller.clear();
              if (!_usesVirtualChatKeyboard(context)) _focusNode.requestFocus();
              _scrollToBottom();
            }

            Future<void> _openVirtualKeyboard(bool canSend) async {
              _focusNode.unfocus();
              await _showVirtualChatKeyboard(
                context: context,
                controller: _controller,
                canSend: canSend,
                onSend: _send,
              );
            }

            String _time(DateTime value) {
              final hour = value.hour.toString().padLeft(2, '0');
              final minute = value.minute.toString().padLeft(2, '0');
              return '$hour:$minute';
            }

            @override
            Widget build(BuildContext context) {
              final size = MediaQuery.sizeOf(context);
              final phone = _usesVirtualChatKeyboard(context);
              final width = math.min(680.0, math.max(280.0, size.width - 24));
              final height = math.min(620.0, math.max(260.0, size.height * .88));
              final canSend = !widget.session.enabled || widget.session.canPlayHere;
              final messages = widget.session.chatMessages;

              return Dialog(
                key: const ValueKey('dialogo-chat'),
                insetPadding: const EdgeInsets.all(12),
                backgroundColor: const Color(0xFF123C30),
                child: SizedBox(
                  width: width,
                  height: height,
                  child: Column(
                    children: [
                      Padding(
                        padding: const EdgeInsets.fromLTRB(14, 8, 6, 6),
                        child: Row(
                          children: [
                            const Icon(Icons.forum_rounded, color: Color(0xFFFFC857)),
                            const SizedBox(width: 8),
                            const Expanded(
                              child: Text(
                                'CHAT DA MESA',
                                style: TextStyle(
                                  color: Colors.white,
                                  fontWeight: FontWeight.w900,
                                ),
                              ),
                            ),
                            IconButton(
                              tooltip: 'Fechar',
                              onPressed: () => Navigator.of(context).pop(),
                              icon: const Icon(Icons.close_rounded),
                            ),
                          ],
                        ),
                      ),
                      const Divider(height: 1, color: Colors.white12),
                      Expanded(
                        child: messages.isEmpty
                            ? const Center(
                                child: Text(
                                  'Nenhuma mensagem ainda.',
                                  style: TextStyle(color: Colors.white38),
                                ),
                              )
                            : ListView.builder(
                                key: const ValueKey('lista-chat'),
                                controller: _scrollController,
                                padding: const EdgeInsets.all(12),
                                itemCount: messages.length,
                                itemBuilder: (context, index) {
                                  final message = messages[index];
                                  final mine = message.seatIndex == widget.session.seatIndex;
                                  return Align(
                                    alignment: mine
                                        ? Alignment.centerRight
                                        : Alignment.centerLeft,
                                    child: Container(
                                      constraints: BoxConstraints(maxWidth: width * .78),
                                      margin: const EdgeInsets.only(bottom: 7),
                                      padding: const EdgeInsets.symmetric(
                                        horizontal: 10,
                                        vertical: 7,
                                      ),
                                      decoration: BoxDecoration(
                                        color: mine
                                            ? const Color(0xFF1D6A50)
                                            : Colors.white.withValues(alpha: .08),
                                        borderRadius: BorderRadius.circular(10),
                                      ),
                                      child: Column(
                                        crossAxisAlignment: mine
                                            ? CrossAxisAlignment.end
                                            : CrossAxisAlignment.start,
                                        children: [
                                          Text(
                                            '${message.author} • ${_time(message.sentAt)}',
                                            style: const TextStyle(
                                              color: Color(0xFFFFD77E),
                                              fontSize: 10,
                                              fontWeight: FontWeight.w700,
                                            ),
                                          ),
                                          const SizedBox(height: 2),
                                          Text(
                                            message.text,
                                            style: const TextStyle(
                                              color: Colors.white,
                                              fontSize: 13,
                                            ),
                                          ),
                                        ],
                                      ),
                                    ),
                                  );
                                },
                              ),
                      ),
                      const Divider(height: 1, color: Colors.white12),
                      SafeArea(
                        top: false,
                        child: Padding(
                          padding: const EdgeInsets.fromLTRB(10, 8, 10, 10),
                          child: Row(
                            children: [
                              Expanded(
                                child: TextField(
                                  key: const ValueKey('input-chat-dialogo'),
                                  controller: _controller,
                                  focusNode: _focusNode,
                                  enabled: canSend,
                                  readOnly: phone,
                                  maxLength: TableChatMessage.maxTextLength,
                                  textInputAction: TextInputAction.send,
                                  onTap: phone && canSend
                                      ? () => _openVirtualKeyboard(canSend)
                                      : null,
                                  onSubmitted: phone ? null : (_) => _send(),
                                  style: const TextStyle(color: Colors.white),
                                  decoration: InputDecoration(
                                    hintText: canSend
                                        ? 'Digite uma mensagem...'
                                        : 'Reconectando ao chat...',
                                    hintStyle: const TextStyle(color: Colors.white38),
                                    counterText: '',
                                    isDense: true,
                                    filled: true,
                                    fillColor: Colors.black12,
                                    border: OutlineInputBorder(
                                      borderRadius: BorderRadius.circular(9),
                                      borderSide: BorderSide.none,
                                    ),
                                  ),
                                ),
                              ),
                              const SizedBox(width: 8),
                              IconButton.filled(
                                key: const ValueKey('enviar-chat-dialogo'),
                                tooltip: 'Enviar mensagem',
                                onPressed: canSend ? _send : null,
                                icon: const Icon(Icons.send_rounded),
                              ),
                            ],
                          ),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          '''
          game_path.write_text(text[:start] + replacement + text[end:])

          test_path = Path('test/widget_test.dart')
          tests = test_path.read_text()
          marker = "  testWidgets('anima a foto do humano quando chega a vez dele', (tester) async {"
          if marker not in tests:
              raise SystemExit('marcador de teste não encontrado')
          new_test = r'''  testWidgets('chat no telefone usa teclado virtual sem abrir teclado do sistema',
              (tester) async {
            tester.view.physicalSize = const Size(360, 640);
            tester.view.devicePixelRatio = 1;
            addTearDown(tester.view.resetPhysicalSize);
            addTearDown(tester.view.resetDevicePixelRatio);
            SharedPreferences.setMockInitialValues({});

            await tester.pumpWidget(
              DouradinhaApp(authService: FakeAuthService(signedIn: true)),
            );
            await tester.pump();
            await tester.tap(find.byKey(const ValueKey('entrar-em-uma-mesa')));
            await tester.pumpAndSettle();

            final input = find.byKey(const ValueKey('input-chat-rapido'));
            expect(input, findsOneWidget);
            expect(tester.widget<TextField>(input).readOnly, isTrue);

            await tester.tap(input);
            await tester.pumpAndSettle();
            expect(find.byKey(const ValueKey('teclado-virtual-chat')), findsOneWidget);

            await tester.tap(find.byKey(const ValueKey('tecla-chat-a')));
            await tester.pump();
            expect(tester.widget<TextField>(input).controller!.text, 'a');

            await tester.tap(find.byKey(const ValueKey('tecla-chat-enviar')));
            await tester.pump();
            expect(find.text('Jogador: a'), findsOneWidget);
            expect(tester.widget<TextField>(input).controller!.text, isEmpty);

            await tester.tap(find.byKey(const ValueKey('fechar-teclado-chat')));
            await tester.pumpAndSettle();
            expect(find.byKey(const ValueKey('teclado-virtual-chat')), findsNothing);
            expect(tester.takeException(), isNull);
            await tester.pumpWidget(const SizedBox.shrink());
          });

          '''
          test_path.write_text(tests.replace(marker, new_test + marker, 1))
          PY

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Formatar
        run: dart format lib/ui/game_page.dart test/widget_test.dart

      - name: Dependências
        run: flutter pub get

      - name: Analisar
        run: flutter analyze

      - name: Testar
        run: flutter test

      - name: Salvar implementação validada
        shell: bash
        run: |
          git restore analysis_options.yaml pubspec.lock 2>/dev/null || true
          rm .github/workflows/apply-virtual-chat-keyboard.yml
          git config user.name "github-actions[bot]"
