name: Aplicar chat e controle de som

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/chat-sound-trigger.txt'

permissions:
  contents: write
  actions: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ajustar chat e som
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          game_path = Path('lib/ui/game_page.dart')
          text = game_path.read_text()

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'{label} não encontrado')
              text = text.replace(old, new, 1)

          replace_once(
              "  static const _savedGameKey = 'douradinha_partida_em_andamento_v1';\n",
              "  static const _savedGameKey = 'douradinha_partida_em_andamento_v1';\n  static const _soundEnabledPreferenceKey = 'douradinha_som_ativado_v1';\n",
              'chave de preferencia',
          )

          replace_once(
              "  bool _spectatorEnding = false;\n",
              "  bool _spectatorEnding = false;\n  bool _soundEnabled = true;\n",
              'estado do som',
          )

          replace_once(
              "      final preferences = await _preferences;\n      try {\n        final savedGame = preferences.getString(_savedGameKey);",
              "      final preferences = await _preferences;\n      _soundEnabled = preferences.getBool(_soundEnabledPreferenceKey) ?? true;\n      try {\n        final savedGame = preferences.getString(_savedGameKey);",
              'restauracao do som',
          )

          replace_once(
              "  Future<void> _playChallengeSound(List<String> sounds) async {\n    if (sounds.isEmpty) return;",
              "  Future<void> _toggleSound() async {\n    final enabled = !_soundEnabled;\n    if (mounted) setState(() => _soundEnabled = enabled);\n    if (!enabled) {\n      try {\n        await _challengeAudioPlayer.stop();\n      } on Object {\n        // Falha ao interromper um som nunca pode afetar a partida.\n      }\n    }\n    try {\n      final preferences = await _preferences;\n      await preferences.setBool(_soundEnabledPreferenceKey, enabled);\n    } on Object {\n      // O controle continua funcionando mesmo sem armazenamento persistente.\n    }\n  }\n\n  Future<void> _playChallengeSound(List<String> sounds) async {\n    if (!_soundEnabled || sounds.isEmpty) return;",
              'reproducao de som',
          )

          replace_once(
              "            _ScoreBoard(\n              game: game,\n              tableSession: tableSession,\n              leaving: _leavingTable,",
              "            _ScoreBoard(\n              game: game,\n              tableSession: tableSession,\n              soundEnabled: _soundEnabled,\n              onSoundToggle: () => unawaited(_toggleSound()),\n              leaving: _leavingTable,",
              'uso do placar',
          )

          replace_once(
              "  const _ScoreBoard({\n    required this.game,\n    required this.tableSession,\n    required this.leaving,\n    required this.onLeave,\n  });\n\n  final DouradinhaGame game;\n  final TableSession tableSession;\n  final bool leaving;\n  final VoidCallback onLeave;",
              "  const _ScoreBoard({\n    required this.game,\n    required this.tableSession,\n    required this.soundEnabled,\n    required this.onSoundToggle,\n    required this.leaving,\n    required this.onLeave,\n  });\n\n  final DouradinhaGame game;\n  final TableSession tableSession;\n  final bool soundEnabled;\n  final VoidCallback onSoundToggle;\n  final bool leaving;\n  final VoidCallback onLeave;",
              'construtor do placar',
          )

          mobile_exit = """                  IconButton(
                    key: const ValueKey('sair-da-mesa'),
                    tooltip: 'Sair da mesa',
                    visualDensity: VisualDensity.compact,"""
          mobile_with_sound = """                  _SoundToggleButton(
                    enabled: soundEnabled,
                    onPressed: onSoundToggle,
                    compact: true,
                  ),
                  IconButton(
                    key: const ValueKey('sair-da-mesa'),
                    tooltip: 'Sair da mesa',
                    visualDensity: VisualDensity.compact,"""
          replace_once(mobile_exit, mobile_with_sound, 'botao de som mobile')

          desktop_exit = """          const SizedBox(width: 6),
          IconButton(
            key: const ValueKey('sair-da-mesa'),"""
          desktop_with_sound = """          const SizedBox(width: 6),
          _SoundToggleButton(
            enabled: soundEnabled,
            onPressed: onSoundToggle,
          ),
          IconButton(
            key: const ValueKey('sair-da-mesa'),"""
          replace_once(desktop_exit, desktop_with_sound, 'botao de som desktop')

          spectator_marker = "class _SpectatorIndicator extends StatelessWidget {"
          sound_button = r'''class _SoundToggleButton extends StatelessWidget {
            const _SoundToggleButton({
              required this.enabled,
              required this.onPressed,
              this.compact = false,
            });

            final bool enabled;
            final VoidCallback onPressed;
            final bool compact;

            @override
            Widget build(BuildContext context) {
              final iconSize = compact ? 20.0 : 24.0;
              return IconButton(
                key: const ValueKey('alternar-som'),
                tooltip: enabled ? 'Desativar som' : 'Ativar som',
                onPressed: onPressed,
                visualDensity: compact ? VisualDensity.compact : VisualDensity.standard,
                padding: EdgeInsets.zero,
                constraints: compact
                    ? const BoxConstraints.tightFor(width: 34, height: 34)
                    : null,
                icon: SizedBox.square(
                  dimension: iconSize + 6,
                  child: Stack(
                    alignment: Alignment.center,
                    children: [
                      Icon(
                        Icons.volume_up_rounded,
                        size: iconSize,
                        color: Colors.white,
                      ),
                      if (!enabled)
                        Transform.rotate(
                          angle: -math.pi / 4,
                          child: Container(
                            key: const ValueKey('som-desativado-traco'),
                            width: iconSize + 5,
                            height: 2.5,
                            decoration: BoxDecoration(
                              color: const Color(0xFFFF3B30),
                              borderRadius: BorderRadius.circular(2),
                            ),
                          ),
                        ),
                    ],
                  ),
                ),
              );
            }
          }

          '''
          replace_once(spectator_marker, sound_button + spectator_marker, 'widget do botao de som')

          replace_once(
              "    const visibleCount = 2;\n",
              "    final visibleCount = phone ? 2 : 5;\n",
              'quantidade de mensagens',
          )
          replace_once(
              "      height: phone ? 48 : 56,\n",
              "      height: phone ? 48 : 76,\n",
              'altura do resumo no PC',
          )

          game_path.write_text(text)

          test_path = Path('test/widget_test.dart')
          tests = test_path.read_text()

          sound_test = r'''
          testWidgets('botão do header alterna e persiste o som', (tester) async {
            tester.view.physicalSize = const Size(360, 640);
            tester.view.devicePixelRatio = 1;
            addTearDown(tester.view.resetPhysicalSize);
            addTearDown(tester.view.resetDevicePixelRatio);
            SharedPreferences.setMockInitialValues({});

            await tester.pumpWidget(
              DouradinhaApp(authService: FakeAuthService(signedIn: true)),
            );
            await tester.pump();
            await tester.tap(find.byKey(const ValueKey('entrar-em-uma-mesa')));
            await tester.pumpAndSettle();

            final soundButton = find.byKey(const ValueKey('alternar-som'));
            expect(soundButton, findsOneWidget);
            expect(find.byKey(const ValueKey('som-desativado-traco')), findsNothing);

            await tester.tap(soundButton);
            await tester.pump();
            expect(find.byKey(const ValueKey('som-desativado-traco')), findsOneWidget);
            await tester.pump(const Duration(milliseconds: 50));
            final preferences = await SharedPreferences.getInstance();
            expect(preferences.getBool('douradinha_som_ativado_v1'), isFalse);

            await tester.tap(soundButton);
            await tester.pump();
            expect(find.byKey(const ValueKey('som-desativado-traco')), findsNothing);
            await tester.pump(const Duration(milliseconds: 50));
            expect(preferences.getBool('douradinha_som_ativado_v1'), isTrue);
            expect(tester.takeException(), isNull);

            await tester.pumpWidget(const SizedBox.shrink());
          });

          '''
          chat_marker = "  testWidgets(\n    'chat mostra duas mensagens e envia apenas pelo diálogo no telefone',"
          if chat_marker not in tests:
              raise SystemExit('marcador do teste de chat não encontrado')
          tests = tests.replace(chat_marker, sound_test + chat_marker, 1)

          desktop_test = r'''
          testWidgets('chat mostra cinco mensagens no PC', (tester) async {
            tester.view.physicalSize = const Size(1200, 800);
            tester.view.devicePixelRatio = 1;
            addTearDown(tester.view.resetPhysicalSize);
            addTearDown(tester.view.resetDevicePixelRatio);
            SharedPreferences.setMockInitialValues({});

            await tester.pumpWidget(
              DouradinhaApp(authService: FakeAuthService(signedIn: true)),
            );
            await tester.pump();
            await tester.tap(find.byKey(const ValueKey('entrar-em-uma-mesa')));
            await tester.pumpAndSettle();

            final dynamic pageState = tester.state(find.byType(GamePage));
            final dynamic session = pageState.tableSession;
            for (var index = 1; index <= 6; index++) {
              session.sendChatMessage('mensagem $index');
            }
            await tester.pump();

            expect(find.text('Jogador: mensagem 1'), findsNothing);
            for (var index = 2; index <= 6; index++) {
              expect(find.text('Jogador: mensagem $index'), findsOneWidget);
            }
            expect(find.byKey(const ValueKey('input-chat-rapido')), findsNothing);
            expect(tester.takeException(), isNull);

            await tester.pumpWidget(const SizedBox.shrink());
          });

          '''
          next_marker = "  testWidgets('anima a foto do humano quando chega a vez dele', (tester) async {"
          if next_marker not in tests:
              raise SystemExit('marcador do teste seguinte não encontrado')
          tests = tests.replace(next_marker, desktop_test + next_marker, 1)
          test_path.write_text(tests)
          PY

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Formatar
        run: dart format lib/ui/game_page.dart test/widget_test.dart

      - name: Dependências
        run: flutter pub get

      - name: Analisar
        run: flutter analyze

      - name: Testar
        run: flutter test

      - name: Salvar implementação validada
        shell: bash
        run: |
          rm -f .github/workflows/apply-chat-sound-toggle.yml
          git checkout -- analysis_options.yaml pubspec.lock 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/ui/game_page.dart test/widget_test.dart .github/workflows/apply-chat-sound-toggle.yml
          git commit -m 'ajusta chat e adiciona controle de som'
          git push origin HEAD:main

      - name: Publicar Flutter Web
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
