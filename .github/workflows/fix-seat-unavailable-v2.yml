name: Validar cadeira indisponível

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-seat-unavailable-v2.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Aplicar correção
        run: |
          awk '/python3 - <<.PY./ {capture=1; next} /^          PY$/ {capture=0} capture {sub(/^          /, ""); print}' .github/workflows/fix-seat-unavailable.yml > /tmp/fix_seat.py
          python3 /tmp/fix_seat.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/table_session_test.dart')
          text = path.read_text()
          text = text.replace(r"'{\"error\":\"Sessão inválida\"}'", "'{\"error\":\"Sessão inválida\"}'".replace('\\\\\"', '\"'))
          path.write_text(text)
          PY
          dart format lib/online/table_session.dart lib/ui/game_page.dart test/table_session_test.dart
          git diff --check

      - name: Instalar dependências
        run: flutter pub get

      - name: Analisar
        run: flutter analyze

      - name: Testar
        run: flutter test

      - name: Gravar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/online/table_session.dart lib/ui/game_page.dart test/table_session_test.dart
          git commit -m "Volta ao lobby quando a cadeira expira"
          git push origin HEAD:main
