name: Corrigir versos do espectador

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-spectator-card-backs-v2.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Aplicar correção
        run: python3 tool/fix_spectator_card_backs.py

      - name: Instalar dependências Flutter
        run: flutter pub get

      - name: Analisar Flutter
        run: flutter analyze

      - name: Testar Flutter
        run: flutter test

      - name: Reverter ajustes automáticos do Flutter
        run: git checkout -- analysis_options.yaml pubspec.lock

      - name: Validar Worker Cloudflare
        working-directory: cloudflare
        run: |
          npm install
          npm run check

      - name: Conferir diff
        run: git diff --check

      - name: Gravar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/src/index.ts lib/online/lobby_service.dart lib/online/table_session.dart lib/ui/game_page.dart test/lobby_service_test.dart
          git commit -m "Mostra versos das cartas ao espectador"
          git push origin HEAD:main
