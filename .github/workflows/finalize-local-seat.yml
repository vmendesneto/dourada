name: Validar jogador local na mesa

on:
  push:
    branches:
      - feat/jogador-local-mesa-final
    paths:
      - .github/workflows/finalize-local-seat.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6
        with:
          ref: feat/jogador-local-mesa-final

      - name: Aplicar ajuste visual
        run: python .github/scripts/apply_local_player_seat.py

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validar Flutter
        run: |
          flutter pub get
          dart format lib/ui/game_page.dart
          flutter analyze
          flutter test

      - name: Salvar versão limpa
        run: |
          git checkout 916228fe16b85e9078963f175b0a4406f03e38e6 -- .github/workflows/pages.yml
          rm -f .github/workflows/apply-local-player-seat.yml
          rm -f .github/scripts/apply_local_player_seat.py
          rm -f .github/trigger-layout-validation.txt
          rm -f .github/workflows/finalize-local-seat.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lib/ui/game_page.dart .github/workflows/pages.yml .github/workflows/apply-local-player-seat.yml .github/scripts/apply_local_player_seat.py .github/trigger-layout-validation.txt .github/workflows/finalize-local-seat.yml
          git commit -m "move jogador local para a mesa"
          git push origin HEAD:feat/jogador-local-mesa-final
