name: Limpar diff da cadeira

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/minimize-seat-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restaurar arquivos e reaplicar somente a correção
        run: |
          git show a63f104a9c902c909c070cb3253208da2fcb7330:lib/online/table_session.dart > lib/online/table_session.dart
          git show a63f104a9c902c909c070cb3253208da2fcb7330:lib/ui/game_page.dart > lib/ui/game_page.dart
          git show a63f104a9c902c909c070cb3253208da2fcb7330:test/table_session_test.dart > test/table_session_test.dart
          git show 0aa3f4265ab4ad8ca277409d2379c3511ed698dd:.github/workflows/fix-seat-unavailable.yml | awk '/python3 - <<.PY./ {capture=1; next} /^          PY$/ {capture=0} capture {sub(/^          /, ""); print}' > /tmp/fix_seat.py
          python3 /tmp/fix_seat.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/table_session_test.dart')
          text = path.read_text()
          text = text.replace(r"'{\"error\":\"Sessão inválida\"}'", "'{\"error\":\"Sessão inválida\"}'".replace('\\\\\"', '\"'))
          path.write_text(text)
          PY
          git diff --check

      - name: Instalar dependências
        run: flutter pub get

      - name: Analisar
        run: flutter analyze

      - name: Testar
        run: flutter test

      - name: Gravar diff mínimo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/online/table_session.dart lib/ui/game_page.dart test/table_session_test.dart
          git commit -m "Mantém correção de cadeira com diff mínimo"
          git push origin HEAD:main
