name: Implementar modo espectador

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-spectator-mode.yml
      - tool/add_spectator_mode.py

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Aplicar modo espectador
        run: python3 tool/add_spectator_mode.py

      - name: Normalizar const do overlay
        run: dart fix --apply lib/ui/game_page.dart

      - name: Instalar dependências Flutter
        run: flutter pub get

      - name: Analisar Flutter
        run: flutter analyze

      - name: Testar Flutter
        run: flutter test

      - name: Validar Worker Cloudflare
        working-directory: cloudflare
        run: |
          npm install
          npm run check

      - name: Conferir diff
        run: git diff --check

      - name: Gravar implementação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/online/lobby_service.dart lib/online/table_session.dart lib/ui/game_page.dart lib/ui/lobby_page.dart cloudflare/src/index.ts test/lobby_service_test.dart test/widget_test.dart
          git commit -m "Adiciona modo espectador às partidas"
          git push origin HEAD:main
