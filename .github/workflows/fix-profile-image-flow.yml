name: Ajustar fluxo de imagem do perfil

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-profile-image-flow.yml
      - tool/fix_profile_image_flow.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Aplicar ajuste
        run: |
          python3 tool/fix_profile_image_flow.py
          git diff --check

      - name: Instalar dependências
        run: flutter pub get

      - name: Analisar
        run: flutter analyze

      - name: Testar
        run: flutter test

      - name: Gravar ajuste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ui/lobby_page.dart test/widget_test.dart
          git commit -m "Melhora escolha de imagem do perfil"
          git push origin HEAD:main
