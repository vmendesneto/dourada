                                key: const ValueKey('lista-chat'),
                                controller: _scrollController,
                                padding: const EdgeInsets.all(12),
                                itemCount: messages.length,
                                itemBuilder: (context, index) {
                                  final message = messages[index];
                                  final mine = message.seatIndex == widget.session.seatIndex;
                                  return Align(
                                    alignment: mine
                                        ? Alignment.centerRight
                                        : Alignment.centerLeft,
                                    child: Container(
                                      constraints: BoxConstraints(maxWidth: width * .78),
                                      margin: const EdgeInsets.only(bottom: 7),
                                      padding: const EdgeInsets.symmetric(
                                        horizontal: 10,
                                        vertical: 7,
                                      ),
                                      decoration: BoxDecoration(
                                        color: mine
                                            ? const Color(0xFF1D6A50)
                                            : Colors.white.withValues(alpha: .08),
                                        borderRadius: BorderRadius.circular(10),
                                      ),
                                      child: Column(
                                        crossAxisAlignment: mine
                                            ? CrossAxisAlignment.end
                                            : CrossAxisAlignment.start,
                                        children: [
                                          Text(
                                            '${message.author} • ${_time(message.sentAt)}',
                                            style: const TextStyle(
                                              color: Color(0xFFFFD77E),
                                              fontSize: 10,
                                              fontWeight: FontWeight.w700,
                                            ),
                                          ),
                                          const SizedBox(height: 2),
                                          Text(
                                            message.text,
                                            style: const TextStyle(
                                              color: Colors.white,
                                              fontSize: 13,
                                            ),
                                          ),
                                        ],
                                      ),
                                    ),
                                  );
                                },
                              ),
                      ),
                      const Divider(height: 1, color: Colors.white12),
                      SafeArea(
                        top: false,
                        child: Padding(
                          padding: const EdgeInsets.fromLTRB(10, 8, 10, 10),
                          child: Row(
                            children: [
                              Expanded(
                                child: TextField(
                                  key: const ValueKey('input-chat-dialogo'),
                                  controller: _controller,
                                  focusNode: _focusNode,
                                  enabled: canSend,
                                  maxLength: TableChatMessage.maxTextLength,
                                  textInputAction: TextInputAction.send,
                                  onSubmitted: (_) => _send(),
                                  style: const TextStyle(color: Colors.white),
                                  decoration: InputDecoration(
                                    hintText: canSend
                                        ? 'Digite uma mensagem...'
                                        : 'Reconectando ao chat...',
                                    hintStyle: const TextStyle(color: Colors.white38),
                                    counterText: '',
                                    isDense: true,
                                    filled: true,
                                    fillColor: Colors.black12,
                                    border: OutlineInputBorder(
                                      borderRadius: BorderRadius.circular(9),
                                      borderSide: BorderSide.none,
                                    ),
                                  ),
                                ),
                              ),
                              const SizedBox(width: 8),
                              IconButton.filled(
                                key: const ValueKey('enviar-chat-dialogo'),
                                tooltip: 'Enviar mensagem',
                                onPressed: canSend ? _send : null,
                                icon: const Icon(Icons.send_rounded),
                              ),
                            ],
                          ),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          '''
          replace_once(
              'lib/ui/game_page.dart',
              '''class _FootLegend extends StatelessWidget {\n  const _FootLegend({required this.game});\n\n  final DouradinhaGame game;\n\n  @override\n  Widget build(BuildContext context) {\n    return Text(\n      'Pé da mão: ${game.players[game.footIndex].name}',\n      style: const TextStyle(color: Colors.white54, fontSize: 10),\n    );\n  }\n}\n\n''',
              chat_widgets,
              'widgets chat',
          )

          test_path = Path('test/table_session_test.dart')
          test_text = test_path.read_text()
          final_marker = '\n}\n'
          pos = test_text.rfind(final_marker)
          if pos < 0:
              raise SystemExit('final de table_session_test não encontrado')
          test_case = r'''

            test('chat local guarda, normaliza e limita mensagens', () async {
              SharedPreferences.setMockInitialValues({});
              final preferences = await SharedPreferences.getInstance();
              final game = DouradinhaGame(random: Random(81));
              final session = TableSession(
                entry: TableEntry(
                  serverUrl: '',
                  tableNumber: '1',
                  playerToken: 'local',
                  websocketUrl: '',
                  seatIndex: 0,
                  phase: LobbyTablePhase.playing,
                  seats: [
                    const LobbySeat(
                      index: 0,
                      kind: 'human',
                      name: 'Ana',
                      team: 0,
                      connected: true,
                    ),
                    ...List<LobbySeat?>.filled(5, null),
                  ],
                ),
              );
              await session.initialize(game, preferences);

              expect(session.sendChatMessage('   Olá   mesa   '), isTrue);
              expect(session.chatMessages.single.author, 'Ana');
              expect(session.chatMessages.single.text, 'Olá mesa');
              expect(session.sendChatMessage('   '), isFalse);

              final longText = List.filled(TableChatMessage.maxTextLength + 20, 'x').join();
              expect(session.sendChatMessage(longText), isTrue);
              expect(session.chatMessages.last.text.length, TableChatMessage.maxTextLength);
              session.dispose();
            });
          '''
          test_path.write_text(test_text[:pos] + test_case + test_text[pos:])
          PY

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Formatar Dart
        run: dart format lib/online/lobby_service.dart lib/online/table_session.dart lib/ui/game_page.dart test/table_session_test.dart

      - name: Instalar dependências Flutter
        run: flutter pub get

      - name: Analisar Flutter
        run: flutter analyze

      - name: Testar Flutter
        run: flutter test

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Validar Worker
        working-directory: cloudflare
        run: |
          npm ci
          npm run check

      - name: Salvar implementação validada
        shell: bash
        run: |
          git restore analysis_options.yaml pubspec.lock 2>/dev/null || true
          rm .github/workflows/apply-chat.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/online/lobby_service.dart lib/online/table_session.dart lib/ui/game_page.dart test/table_session_test.dart cloudflare/src/index.ts cloudflare/src/chat.ts cloudflare/test/chat.test.ts .github/workflows/apply-chat.yml
          git commit -m "implementa chat da mesa"
          git push origin HEAD:main

      - name: Publicar Flutter Web
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
