name: Aplicar chat da mesa

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Implementar chat
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: esperado 1 trecho, encontrado {count}')
              file.write_text(text.replace(old, new, 1))

          Path('cloudflare/src/chat.ts').write_text(r'''export const maxChatTextLength = 240;
          export const maxChatMessages = 100;

          export interface TableChatMessage {
            id: string;
            seatIndex: number;
            author: string;
            text: string;
            sentAt: number;
          }

          export function cleanChatText(value: unknown): string | null {
            if (typeof value !== "string") return null;
            const normalized = value
              .replace(/[\u0000-\u001f\u007f]/g, " ")
              .replace(/\s+/g, " ")
              .trim();
            if (normalized.length === 0) return null;
            return Array.from(normalized).slice(0, maxChatTextLength).join("");
          }

          export function normalizeChatMessages(value: unknown): TableChatMessage[] {
            if (!Array.isArray(value)) return [];
            const messages: TableChatMessage[] = [];
            for (const raw of value) {
              if (!raw || typeof raw !== "object" || Array.isArray(raw)) continue;
              const candidate = raw as Partial<TableChatMessage>;
              const text = cleanChatText(candidate.text);
              const author = typeof candidate.author === "string"
                ? Array.from(candidate.author.trim()).slice(0, 80).join("")
                : "";
              if (
                typeof candidate.id !== "string" ||
                !Number.isInteger(candidate.seatIndex) ||
                candidate.seatIndex! < 0 ||
                candidate.seatIndex! > 5 ||
                author.length === 0 ||
                text === null ||
                typeof candidate.sentAt !== "number" ||
                !Number.isFinite(candidate.sentAt)
              ) {
                continue;
              }
              messages.push({
                id: candidate.id,
                seatIndex: candidate.seatIndex!,
                author,
                text,
                sentAt: candidate.sentAt,
              });
            }
            return messages.slice(-maxChatMessages);
          }
          ''')

          Path('cloudflare/test/chat.test.ts').write_text(r'''import { describe, expect, it } from "vitest";
          import {
            cleanChatText,
            maxChatMessages,
            maxChatTextLength,
            normalizeChatMessages,
          } from "../src/chat";

          describe("chat da mesa", () => {
            it("limpa espaços, controles e limita o tamanho", () => {
              expect(cleanChatText("  Olá\n\u0000 mesa   ")).toBe("Olá mesa");
              expect(Array.from(cleanChatText("x".repeat(400)) ?? "")).toHaveLength(
                maxChatTextLength,
              );
              expect(cleanChatText("   \n\t ")).toBeNull();
            });

            it("mantém somente mensagens válidas e as 100 mais recentes", () => {
              const source = Array.from({ length: maxChatMessages + 5 }, (_, index) => ({
                id: `m-${index}`,
                seatIndex: index % 6,
                author: `Jogador ${index % 6}`,
                text: `Mensagem ${index}`,
                sentAt: 1000 + index,
              }));
              source.splice(8, 0, {
                id: "inválida",
                seatIndex: 9,
                author: "Intruso",
                text: "não entra",
                sentAt: 1008,
              });

              const messages = normalizeChatMessages(source);
              expect(messages).toHaveLength(maxChatMessages);
              expect(messages[0]?.id).toBe("m-5");
              expect(messages.at(-1)?.id).toBe(`m-${maxChatMessages + 4}`);
            });
          });
          ''')

